# Weekly pull requests for outdated or vulnerable npm packages, monthly for
# the GitHub Actions used by CI. The repo owner must have Dependabot alerts
# and security updates switched on (Settings -> Code security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
